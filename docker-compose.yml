# Local development — Postgres only.
# Run the FastAPI app directly via `uv run uvicorn app.main:app --reload`
# so reload + breakpoints work cleanly.
#
# Usage:
#   docker compose up -d postgres
#   uv run uvicorn app.main:app --reload

services:
  postgres:
    image: postgres:16-alpine
    container_name: oorvashee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oorvashee
      POSTGRES_PASSWORD: oorvashee
      POSTGRES_DB: oorvashee
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oorvashee -d oorvashee"]
      interval: 5s
      timeout: 3s
      retries: 10
