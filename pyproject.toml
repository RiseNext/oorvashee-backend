[project]
name = "oorvashee-backend"
version = "0.1.0"
description = "Oorvashee Saree House — FastAPI e-commerce backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Oorvashee Saree House" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Validation + settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",  # for Alembic offline/online sync ops

    # Auth (Clerk JWT via JWKS)
    "pyjwt[crypto]>=2.9.0",

    # HTTP client (outbound to Clerk, Razorpay, Cloudinary, Resend)
    "httpx>=0.27.0",

    # Webhook signature verification (Clerk uses Svix)
    "svix>=1.30.0",

    # Logging
    "structlog>=24.4.0",

    # Multipart (for future admin uploads)
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- uv ---
[tool.uv]
package = true

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ASYNC",
    "S",    # bandit (security)
    "RUF",
]
ignore = [
    "S101",  # assert used (pytest)
    "B008",  # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]
"alembic/env.py" = ["E402"]

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["svix.*"]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

# --- coverage ---
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/migrations/*"]
